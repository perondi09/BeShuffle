<text x="70" y="824" font-size="13" font-weight="700" fill="#1c1530">Infraestrutura em Terraform (infra/terraform). Segredos só no SSM e no Secrets Manager, nunca no código nem no GitHub.</text>
<text x="70" y="845" font-size="13" fill="#4a4166">Deploy automático pelo GitHub Actions por OIDC: pronto no código, desligado porque o plano Free da AWS não permite criar o provedor de identidade.</text>
