<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" width="1400" height="940" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="titulo descricao">
<title id="titulo">BeShuffle na AWS: arquitetura e entrega</title>
<desc id="descricao">O navegador resolve beshuffle.com.br no Route 53 e fala em HTTPS com o CloudFront, que usa um certificado do ACM. O CloudFront serve o site do S3 e repassa /api para a API em Docker num EC2 t4g.small em us-east-2, que usa um RDS PostgreSQL privado, lê segredos do SSM e do Secrets Manager, puxa a imagem do ECR, manda logs ao CloudWatch e chama a Web API do Spotify. O código passa por branches, test e master com CI no GitHub Actions e vai para a AWS pelo script deploy-manual.sh.</desc>
<defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c1530"/></marker></defs>
<rect width="1400" height="940" fill="#fbfaff"/>
<text x="30" y="50" font-size="28" font-weight="800" fill="#1c1530">BeShuffle na AWS</text>
<text x="30" y="76" font-size="14" fill="#4a4166">https://beshuffle.com.br: um álbum do Spotify por dia, sorteios e notas. Arquitetura em nuvem e caminho do código até o ar.</text>
