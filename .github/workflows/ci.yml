# O GitHub só lê workflows em .github/ na raiz; o resto da parte de devops fica em infra/.
name: CI

on:
  push:
    branches: [master, test]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Os testes usam H2 e chaves falsas (application-test.properties): não precisam de .env nem de segredos.
      - name: Testes
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Stack Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Sobe Postgres, API e site como no Docker local: pega migration quebrada, API que não sobe e proxy errado.
      # Senha aleatória só para este banco descartável; chaves do Spotify falsas (a API sobe sem chamar o Spotify).
      - name: Subir a stack
        working-directory: infra
        run: |
          SENHA="$(openssl rand -hex 16)"
          echo "::add-mask::$SENHA"
          echo "DB_PASSWORD=$SENHA" >> "$GITHUB_ENV"
          DB_PASSWORD="$SENHA" SPOTIFY_CLIENT_ID=ci SPOTIFY_CLIENT_SECRET=ci \
            docker compose up -d --build --wait --wait-timeout 240

      - name: Conferir a API pelo site
        run: |
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS http://localhost:3000/api/draws/allowance | grep -q '"plan":"VISITANTE"'
          curl -fsS -o /dev/null http://localhost:3000/perfil

      - name: Logs da stack (se falhar)
        if: failure()
        working-directory: infra
        run: SPOTIFY_CLIENT_ID=ci SPOTIFY_CLIENT_SECRET=ci docker compose logs --tail 200
