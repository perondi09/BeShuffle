# Deploy na AWS depois que o CI passa na master (ver infra/terraform e infra/README.md).
# Sem a variável AWS_DEPLOY_ROLE_ARN no repositório (infra ainda não criada), o job é pulado.
name: Deploy AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    name: API no EC2 e site no S3
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    # Runner ARM: a imagem sai nativa para o EC2 Graviton, sem emulação.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Credenciais temporárias (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Imagem da API
        run: |
          docker build -f infra/docker/backend.Dockerfile -t "$ECR_REPOSITORY:$TAG" -t "$ECR_REPOSITORY:latest" backend
          docker push "$ECR_REPOSITORY:$TAG"
          docker push "$ECR_REPOSITORY:latest"

      - name: Atualizar a API no EC2
        run: |
          COMANDO=$(aws ssm send-command --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript --comment "deploy $TAG" \
            --parameters "commands=['/opt/beshuffle/deploy.sh $TAG']" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMANDO" --instance-id "$EC2_INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$COMANDO" --instance-id "$EC2_INSTANCE_ID" \
            --query "[Status, StandardOutputContent, StandardErrorContent]" --output text | tee resultado.txt
          head -1 resultado.txt | grep -q Success

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build do site
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Publicar o site
        run: |
          aws s3 sync frontend/dist/assets "s3://$SITE_BUCKET/assets" --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/dist "s3://$SITE_BUCKET" --delete --exclude "assets/*" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
