spring.application.name=BeShuffle

# Chaves e senhas vêm só do infra/.env (copiado de infra/.env.example, ignorado pelo git).
# Rodando pela IDE ou pelo mvnw a partir de backend/, o arquivo é lido daqui; no Docker, o compose
# repassa as mesmas variáveis como ambiente, que têm prioridade sobre o arquivo.
spring.config.import=optional:file:../infra/.env[.properties]

server.port=${SERVER_PORT:8080}

# Contas (config/SecurityConfig): sessão por cookie, sem o usuário de teste que o Spring cria sozinho.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.servlet.session.timeout=${SESSION_TIMEOUT:7d}
server.servlet.session.cookie.max-age=${SESSION_TIMEOUT:7d}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true em produção (HTTPS); em localhost o cookie Secure não seria enviado
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Fuso usado para decidir quando um novo "dia" começa (álbum do dia, agendador)
beshuffle.timezone=${BESHUFFLE_TIMEZONE:America/Sao_Paulo}

# Sorteio (config/SorteioProperties): ano aleatório + página entre os primeiros resultados de "year:ANO",
# que o Spotify ordena por relevância. Os valores abaixo são os padrões; descomente para mudar.
#beshuffle.sorteio.mercado=BR
#beshuffle.sorteio.ano-inicial=1960
#beshuffle.sorteio.paginas=5
#beshuffle.sorteio.tamanho-pagina=10
#beshuffle.sorteio.tentativas=5
#beshuffle.sorteio.min-faixas=6
#beshuffle.sorteio.max-faixas=40
#beshuffle.sorteio.termos-bloqueados=ninar,infantil,karaoke,tribute,coletanea,greatest hits,...

# Spotify API: sem valor padrão; sem as variáveis no .env a aplicação não sobe.
spotify.client.id=${SPOTIFY_CLIENT_ID}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET}
spotify.auth.url=https://accounts.spotify.com

# Database configuration
# Padrão: Postgres do docker-compose acessado pela máquina (localhost:5435).
# Dentro do Docker, o compose define DB_HOST=db e DB_PORT=5432.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:beshuffle_db}
spring.datasource.username=${DB_USER:postgres}
# Sem valor padrão: sem DB_PASSWORD no .env a aplicação não sobe.
spring.datasource.password=${DB_PASSWORD}

# O schema é versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só confere.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.perondi.BeShuffle=DEBUG
# Use LOG_PATH (default /tmp) for the file path inside containers; ensures consistency with logback-spring.xml
logging.file.path=${LOG_PATH:/tmp}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
