spring.application.name=BeShuffle

# Spotify API - Carregadas do arquivo .env
spotify.client.id=${SPOTIFY_CLIENT_ID}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET}
spotify.auth.url=https://accounts.spotify.com

# Configurações do banco de dados

spring.datasource.url=jdbc:postgresql://localhost:5435/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.perondi.beshuffle=DEBUG