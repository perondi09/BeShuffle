spring.application.name=BeShuffle

# Spotify API
spotify.client.id=${SPOTIFY_CLIENT_ID:dev-client-id}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:dev-client-secret}
spotify.auth.url=https://accounts.spotify.com

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/${DB_NAME:beshuffle_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Senhalol.123}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.open-in-view=false

logging.level.root=INFO
logging.level.perondi.BeShuffle=DEBUG
logging.file.name=logs/beshuffle.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n