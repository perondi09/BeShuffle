spring.application.name=BeShuffle

# Spotify API - Carregadas do arquivo .env
spotify.client.id=${SPOTIFY_CLIENT_ID:dev-client-id}
spotify.client.secret=${SPOTIFY_CLIENT_SECRET:dev-client-secret}
spotify.auth.url=https://accounts.spotify.com

# Configurações do banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5435/${DB_NAME:beshuffle_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.perondi.BeShuffle=DEBUG
logging.file.name=logs/beshuffle.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n